name: Enviar notificações push

on:
  schedule:
    # A cada 5 minutos. O GitHub Actions não garante execução exata
    # nesse intervalo (pode atrasar em picos de uso da plataforma) —
    # é a limitação esperada da opção gratuita, sem Cloud Scheduler.
    - cron: "*/5 * * * *"
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions, útil para testar

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências
        working-directory: tcc/scripts
        run: npm install --omit=dev

      - name: Executar script de notificações
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node enviar-notificacoes.js
