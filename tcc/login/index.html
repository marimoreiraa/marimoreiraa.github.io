<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2E63E8">
  <link rel="manifest" href="../manifest.json">
  <title>Entrar | Painel Autonomia</title>
  <style>
    :root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; color: #23272F; background: #F5F6F8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 420px); padding: 36px; background: #FFFFFF; border: 1px solid #E1E4E8; border-radius: 18px; box-shadow: 0 16px 40px rgba(35, 39, 47, 0.10); }
    h1 { margin: 0 0 8px; font-size: 2rem; color: #244FBB; }
    p { margin: 0 0 24px; color: #626A75; line-height: 1.5; }
    label { display: block; margin-top: 16px; font: 600 0.9rem/1.3 -apple-system, "Segoe UI", sans-serif; color: #555C66; }
    input { width: 100%; margin-top: 7px; padding: 13px 14px; border: 1px solid #D8DBE0; border-radius: 10px; font: 1rem -apple-system, "Segoe UI", sans-serif; background: #FAFBFC; }
    input:focus { outline: 3px solid rgba(46, 99, 232, 0.18); border-color: #2E63E8; }
    button { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 10px; background: #2E63E8; color: #FFFFFF; cursor: pointer; font: 700 1rem -apple-system, "Segoe UI", sans-serif; }
    button:disabled { opacity: 0.65; cursor: wait; }
    .cadastro { margin: 20px 0 0; text-align: center; font: 0.9rem -apple-system, "Segoe UI", sans-serif; }
    a { color: #244FBB; font-weight: 700; }
    #mensagem { min-height: 1.4em; margin: 14px 0 0; font: 0.9rem -apple-system, "Segoe UI", sans-serif; color: #D64545; }
  </style>
</head>
<body>
  <main>
    <h1>Painel Autonomia</h1>
    <p>Entre para acessar a rotina e os lembretes cadastrados.</p>
    <form id="form-login">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="senha">Senha</label>
      <input id="senha" name="senha" type="password" autocomplete="current-password" required>
      <button id="btn-entrar" type="submit">Entrar</button>
      <div id="mensagem" role="alert"></div>
    </form>
    <div class="cadastro">Ainda não tem uma conta? <a href="../cadastro/">Cadastrar</a></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWETQhgszkYUtuADX0SZ14CkxuP_ekz8M",
      authDomain: "rotina-tea.firebaseapp.com",
      projectId: "rotina-tea",
      storageBucket: "rotina-tea.firebasestorage.app",
      messagingSenderId: "153201667136",
      appId: "1:153201667136:web:e0e891c2cd45d29e9703a5"
    };

    const auth = getAuth(initializeApp(firebaseConfig));
    const form = document.getElementById("form-login");
    const botao = document.getElementById("btn-entrar");
    const mensagem = document.getElementById("mensagem");

    onAuthStateChanged(auth, (usuario) => {
      if (usuario) window.location.replace("../admin/");
    });

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      botao.disabled = true;
      mensagem.textContent = "";
      try {
        await signInWithEmailAndPassword(auth, form.email.value.trim(), form.senha.value);
        window.location.replace("../admin/");
      } catch (erro) {
        console.error("Erro ao entrar:", erro);
        mensagem.textContent = "E-mail ou senha inválidos.";
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
