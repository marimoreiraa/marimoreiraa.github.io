<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#EFF6EE">
  <link rel="manifest" href="../manifest.json">
  <title>Painel</title>
  <link rel="stylesheet" href="../static/painel/style.css">
</head>
<body>
  <button id="btn-configuracoes" class="btn-configuracoes" type="button" aria-label="Configurar modo de exibição" title="Configurar modo de exibição">⚙</button>
  <aside id="configuracoes" class="configuracoes" hidden>
    <label for="modo-exibicao">Modo de exibição</label>
    <select id="modo-exibicao">
      <option value="fixo">Painel fixo</option>
      <option value="pessoal">Dispositivo pessoal (Dia a dia)</option>
    </select>
    <label class="configuracao-checkbox">
      <input id="mostrar-texto-fixo" type="checkbox">
      Mostrar instrução escrita no painel fixo
    </label>
  </aside>

  <div id="tela-inicio" class="tela ativa" onclick="iniciar()">
    <div class="msg-inicio">
      <div class="icone-toque">👆</div>
      <div class="texto-toque">Toque para começar</div>
    </div>
  </div>

  <div id="tela-livre" class="tela">
    <div class="conteudo-livre">
      <div class="emoji-livre">✅</div>
      <div class="texto-livre">Tudo pronto por enquanto!</div>
    </div>
  </div>

  <div id="tela-tarefa" class="tela">
    <div class="conteudo-tarefa">
      <div class="detalhes-tarefa">
        <h1 id="titulo-tarefa"></h1>
        <p id="texto-instrucao"></p>
      </div>
      <div class="moldura-foto">
        <img id="foto-tarefa" src="" alt="Tarefa atual">
      </div>
      <audio id="audio-tarefa" class="player-instrucao" preload="auto" controls></audio>
      <div class="acoes-tarefa">
        <button id="btn-concluir" class="botao-acao botao-concluir" onclick="concluirTarefa()" aria-label="Concluir tarefa">
          <span class="icone-acao">✔</span>
        </button>
        <button id="btn-recusar" class="botao-acao botao-recusar" onclick="recusarTarefa()" aria-label="Recusar tarefa" hidden>
          <span class="icone-acao">✕</span>
        </button>
      </div>
    </div>
  </div>

  <audio id="audio-sucesso" src="../static/sounds/sucesso.wav" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCWETQhgszkYUtuADX0SZ14CkxuP_ekz8M",
      authDomain: "rotina-tea.firebaseapp.com",
      projectId: "rotina-tea",
      storageBucket: "rotina-tea.firebasestorage.app",
      messagingSenderId: "153201667136",
      appId: "1:153201667136:web:e0e891c2cd45d29e9703a5"
    };

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
    window.firestore = { collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot };
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      navigator.serviceWorker.register("../sw.js").catch(console.error);
    }
    await import("../static/painel/app.js");
  </script>
</body>
</html>
